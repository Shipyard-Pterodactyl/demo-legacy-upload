name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: ./gradlew assemble -PbuildNumber=${{ github.run_number }} -PcommitHash=${GITHUB_SHA::7}
      - name: Send the build to the panel
        if: github.event_name != 'pull_request'
        uses: Shipyard-Pterodactyl/shipyard-action@v1
        with:
          panel-url: https://incidents-skill-keith-attendance.trycloudflare.com
          files: build/libs/*.jar
        env:
          SHIPYARD_SECRET: ${{ secrets.SHIPYARD_SECRET }}
